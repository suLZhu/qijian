name: Build Qijian Android debug APK

on:
  push:
    branches: [feature/ui-clean-slate-preview]
    paths:
      - '.github/workflows/build-qijian-debug.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'android/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'public/**'
      - 'index.html'
  workflow_dispatch:
    inputs:
      channel:
        description: '发布渠道（仅在整合分支生效）'
        type: choice
        options:
          - artifact
          - beta
          - stable
        default: artifact

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: qijian-android-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build web assets
        run: npm run build
      - name: Run full test suite
        run: npm test
      - name: Run vision, backup and time regression tests
        run: node --test tests/vision-attachments.test.mjs tests/backups.test.mjs tests/time-context.test.mjs
      - name: Chromium startup smoke test
        run: |
          npm install --no-save --no-audit --no-fund puppeteer-core
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node tests/smoke-startup.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Use runner native AAPT2
        run: sed -i '/^android.aapt2FromMavenOverride=/d' android/gradle.properties
      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK metadata and signature
        run: |
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          test -n "$APK"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          "$SDK/aapt" dump badging "$APK" | sed -n '/^package:/p'
          "$SDK/apksigner" verify --print-certs "$APK"
          stat -c '%n %s bytes' "$APK"
          sha256sum "$APK"
      - name: Upload Qijian debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qijian-debug-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified APK and update metadata
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/ui-clean-slate-preview' && (inputs.channel == 'beta' || inputs.channel == 'stable')
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'beta' }}
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          SIGNER="$("$SDK/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$SIGNER" = d01c21ef8dacfb82fcf8307b608cccbcb1f796737ff4561fe99e8a3cd7ffcaae
          "$SDK/aapt" dump badging "$APK" > "$RUNNER_TEMP/qijian-badging"
          OUTPUT="$RUNNER_TEMP/qijian-release"
          mkdir -p "$OUTPUT"
          TAG="qijian-$CHANNEL"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern latest.json --dir "$OUTPUT" || true
          else
            EXTRA=(--latest=false)
            if [ "$CHANNEL" = beta ]; then EXTRA+=(--prerelease); fi
            gh release create "$TAG" --target "$GITHUB_SHA" --title "栖间 $CHANNEL 更新渠道" "${EXTRA[@]}"
          fi
          node scripts/prepare-apk-release.mjs "$APK" "$RUNNER_TEMP/qijian-badging" "$OUTPUT" "$CHANNEL"
          gh release upload "$TAG" "$OUTPUT"/*.apk
          gh release upload "$TAG" "$OUTPUT/latest.json" --clobber
